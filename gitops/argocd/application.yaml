apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-web
  namespace: argocd
spec:
  project: interview-demo
  source:
    repoURL: git@github.com:erictanli/demo-k8s.git
    targetRevision: main
    path: gitops/apps/demo-web/overlays/local
    kustomize:
      patches:
        - target:
            kind: Service
            name: demo-web
          patch: |-
            apiVersion: v1
            kind: Service
            metadata:
              name: demo-web
            spec:
              type: NodePort
              ports:
                - name: http
                  port: 80
                  targetPort: http
                  nodePort: 30080
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
