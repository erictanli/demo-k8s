apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.0.0/config/install.yaml
patches:
  - target:
      kind: Namespace
      name: argocd-image-updater-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd-image-updater-system
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    patch: |-
      - op: add
        path: /data
        value:
          interval: 1m
          log.level: info
          git.user: demo-image-updater
          git.email: demo-image-updater@users.noreply.github.com
