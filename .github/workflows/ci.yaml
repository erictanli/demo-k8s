name: Build and publish
on:
  pull_request:
    paths:
      - app/**
      - .github/workflows/ci.yaml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - app/**
      - .github/workflows/ci.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm --prefix app test

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and source
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must look like v1.0.1, without prerelease suffixes or leading zeros.' >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          [[ ${#tag} -le 128 ]] || { echo 'Image tag exceeds 128 characters.' >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Reject an already published version
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$RELEASE_VERSION" --output json)
          ECR_RESULT="$result" node --input-type=module -e '
            const result = JSON.parse(process.env.ECR_RESULT);
            if (result.images?.length) throw new Error("Version already published. Use a new release version; immutable tags cannot be rebuilt.");
            if (result.failures?.length !== 1 || result.failures[0].failureCode !== "ImageNotFound") throw new Error("Could not confirm version availability.");
          '
      - name: Build and push both CPU architectures
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            BUILD_TAG=${{ steps.metadata.outputs.tag }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record published artifact
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
